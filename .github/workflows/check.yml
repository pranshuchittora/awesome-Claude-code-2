name: Check pull request

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate data/projects.json
        run: python scripts/build.py --check
      - name: Make sure the build still runs
        run: python scripts/build.py
